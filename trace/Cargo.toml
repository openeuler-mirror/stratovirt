[package]
name = "trace"
version = "2.5.0"
authors = ["Huawei StratoVirt Team"]
edition = "2021"
license = "Mulan PSL v2"
description = "Provide tracing infrastructure for StratoVirt"

[dependencies]
log = "0.4"
lazy_static = { version = "1.4.0", optional = true }
regex = { version = "1", optional = true }
anyhow = "1.0"
trace_generator = { path = "trace_generator" }
vmm-sys-util = "0.12.1"
libloading = "0.7.4"

[features]
default = []
trace = ["dep:lazy_static", "dep:regex"]
trace_to_logger = ["trace"]
trace_to_ftrace = ["trace"]
trace_to_hitrace = ["trace"]
